[package]
name = "tune"
version = "0.2.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Spotify Connect controller TUI. Part of the Fe2O3 Rust terminal suite."
license = "Unlicense"
repository = "https://github.com/isene/tune"

[dependencies]
crust    = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
# sync rspotify (ureq + rustls-with-native-certs to match kastrup/tock/amar)
rspotify = { version = "0.16", default-features = false, features = ["client-ureq", "ureq-rustls-tls-native-certs"] }
chrono   = "0.4"
webbrowser = "0.8"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq     = { version = "2", features = ["tls"] }
# Async runtime for librespot's Spirc loop. Single-threaded scheduler
# only — one connect session, no work-stealing required.
tokio    = { version = "1", features = ["rt", "macros", "sync", "time"] }

# librespot — Spotify Connect endpoint. Per-target feature split:
#  - Linux: pulseaudio-backend (native PulseAudio / PipeWire-pulse,
#    idle-suspends when nothing plays).
#  - macOS / other: rodio-backend (CoreAudio on macOS, cross-platform
#    fallback elsewhere — no libpulse-dev required).
# `with-libmdns` / `with-avahi` are intentionally OFF: zeroconf adds
# periodic wakeups and we authenticate via OAuth, not LAN broadcast.
[target.'cfg(target_os = "linux")'.dependencies]
librespot = { version = "0.8", default-features = false, features = ["pulseaudio-backend", "rustls-tls-native-roots"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
librespot = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = true
strip = true
