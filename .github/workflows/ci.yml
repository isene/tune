name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: tune

      - name: Checkout crust
        uses: actions/checkout@v6
        with:
          repository: isene/crust
          path: crust

      - name: Checkout glow
        uses: actions/checkout@v6
        with:
          repository: isene/glow
          path: glow

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libpulse-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev

      - name: Build
        working-directory: tune
        run: cargo build --release

      - name: Test
        working-directory: tune
        run: cargo test --release

      - name: Binary size
        working-directory: tune
        run: ls -lh target/release/tune
