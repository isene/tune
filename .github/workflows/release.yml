name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tune-linux-x86_64
          # aarch64-linux cross-compile dropped: alsa-sys + libpulse-sys
          # both need their dev headers in the cross sysroot, and the
          # default GH runner doesn't carry libasound2-dev:arm64 /
          # libpulse-dev:arm64. Raspberry Pi / aarch64 users can
          # `cargo build --release` locally — the native build works
          # fine, just CI cross-compile doesn't.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tune-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tune-macos-aarch64

    steps:
      - uses: actions/checkout@v7
        with:
          path: tune

      - name: Checkout crust
        uses: actions/checkout@v7
        with:
          repository: isene/crust
          path: crust

      - name: Checkout glow
        uses: actions/checkout@v7
        with:
          repository: isene/glow
          path: glow

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libpulse-dev (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev

      - name: Build
        working-directory: tune
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        working-directory: tune
        run: |
          cp target/${{ matrix.target }}/release/tune ../${{ matrix.artifact }}
          chmod +x ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform:
            ```bash
            chmod +x tune-*
            ./tune-linux-x86_64    # or your platform
            ```

            Optionally copy to your PATH:
            ```bash
            sudo cp tune-linux-x86_64 /usr/local/bin/tune
            ```

            ## Platforms
            - `tune-linux-x86_64` - Linux (Intel/AMD 64-bit)
            - `tune-macos-x86_64` - macOS (Intel)
            - `tune-macos-aarch64` - macOS (Apple Silicon)

            ## aarch64-linux (Raspberry Pi etc.)
            Not provided as a prebuilt because libpulse-dev / libasound2-dev
            need the arm64 sysroot which the GH runners don't carry. Native
            `cargo build --release` works fine on aarch64 hardware.
