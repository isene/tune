version: 2
updates:
  # GitHub Actions versions only. Cargo is omitted on purpose: this
  # crate depends on a sibling path-dep (../crust) which the
  # dependabot updater container can't resolve, so every Cargo scan
  # fails. Security alerts still surface via the repo Security tab
  # (GitHub-side, not dependabot).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
