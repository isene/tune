<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#06051a"/>
    </radialGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  style="stop-color:#1ed760"/>
      <stop offset="100%" style="stop-color:#117a36"/>
    </linearGradient>
  </defs>

  <!-- Vinyl-style disc with rust-orange ring -->
  <circle cx="128" cy="128" r="120" fill="url(#disc)" stroke="url(#rust)" stroke-width="3"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#f74c00" stroke-width="0.4" opacity="0.18"/>
  <circle cx="128" cy="128" r="80"  fill="none" stroke="#f74c00" stroke-width="0.4" opacity="0.22"/>
  <circle cx="128" cy="128" r="60"  fill="none" stroke="#f74c00" stroke-width="0.4" opacity="0.28"/>

  <!-- Inner label disc -->
  <circle cx="128" cy="128" r="48" fill="#0a0a14" stroke="url(#green)" stroke-width="2"/>

  <!-- Play triangle, Spotify-green, centered + slightly right-biased -->
  <polygon points="116,104 116,152 154,128" fill="url(#green)" filter="url(#glow)"/>

  <!-- subtle outer glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- wordmark -->
  <text x="128" y="232" font-family="monospace" font-size="22" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="6">tune</text>
</svg>
